<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Masters Leadership Academy</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0B192C;
    color: #F5EFE2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 420px; }
  h1 { font-size: 22px; margin-bottom: 12px; }
  p { font-size: 14px; color: #9AACA6; line-height: 1.6; }
  button {
    margin-top: 20px;
    background: #D4AF37;
    color: #1B0F05;
    border: none;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 2px;
  }
  button:hover { background: #E6C55F; }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>This page isn't available without a connection. Previously visited pages may still work from cache. Try again once you're back online.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
